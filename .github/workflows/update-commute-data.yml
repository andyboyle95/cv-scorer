name: Update Commute Data

on:
  schedule:
    # Every Sunday at 23:00 UTC (DESNZ publish weekly fuel prices on Mondays)
    - cron: '0 23 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node scripts/update-commute-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/commute-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update commute fuel prices $(date -u +'%Y-%m-%d')"
            git push
          fi

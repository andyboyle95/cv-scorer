<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3668"/>
      <stop offset="1" stop-color="#0e1f3f"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- pink brand accent stripe scaled to 180 -->
  <rect x="0" y="0" width="180" height="12" fill="#df2681"/>

  <!-- AW monogram at 180x180 — beefy, still legible when scaled to home-screen size -->
  <text
    x="90" y="128"
    text-anchor="middle"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif"
    font-size="86"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-4"
  >AW</text>
</svg>

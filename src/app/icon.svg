<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3668"/>
      <stop offset="1" stop-color="#0e1f3f"/>
    </linearGradient>
  </defs>

  <!-- rounded navy tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- pink brand accent stripe across the top (matches the CV output brand strip) -->
  <rect x="0" y="0" width="64" height="4.5" fill="#df2681"/>

  <!-- AW monogram: bold, condensed, letter-spaced tight for legibility at 16px -->
  <text
    x="32" y="46"
    text-anchor="middle"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif"
    font-size="30"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-1.5"
  >AW</text>
</svg>

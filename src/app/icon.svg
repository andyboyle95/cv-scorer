<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3668"/>
      <stop offset="1" stop-color="#0e1f3f"/>
    </linearGradient>
  </defs>
  <!-- rounded navy tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- document shape: white sheet with a subtle folded corner -->
  <path d="M18 15 h20 l8 8 v26 a3 3 0 0 1 -3 3 h-25 a3 3 0 0 1 -3 -3 v-31 a3 3 0 0 1 3 -3 z"
        fill="#ffffff"/>
  <!-- fold triangle -->
  <path d="M38 15 v8 h8 z" fill="#e9edf5"/>

  <!-- text lines on the doc -->
  <rect x="22" y="28" width="18" height="2" rx="1" fill="#1a3668" opacity=".55"/>
  <rect x="22" y="33" width="16" height="2" rx="1" fill="#1a3668" opacity=".35"/>
  <rect x="22" y="38" width="12" height="2" rx="1" fill="#1a3668" opacity=".35"/>

  <!-- pink AI sparkle overlaid on the corner -->
  <g transform="translate(42 40)">
    <path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z"
          fill="#df2681"/>
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
  </g>
</svg>

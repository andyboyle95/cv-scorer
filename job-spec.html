<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Spec Creator | Aaron Wallis Sales Recruitment</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F7F7; }
    #loading {
      position: fixed; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      background: #F7F7F7; color: #1a3668;
      font-family: Arial, Helvetica, sans-serif; font-size: 15px;
    }
    iframe { width: 100%; height: 100vh; border: 0; display: block; }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <iframe
    src="https://cv-scorer-hmv5.onrender.com/job-spec"
    title="Job Spec Creator"
    allow="clipboard-write"
    onload="var l=document.getElementById('loading'); if (l) l.style.display='none';"></iframe>
</body>
</html>
